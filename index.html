<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yaratıcılık Vadisi</title>
  <link rel="icon" type="image/png" href="resimler/maskot.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img class="kapak" src="resimler/kapak.png" alt="Sarı atkılı kil tilki, nehrin iki yakasındaki bilgisayar masasına, futbol sahasına ve müzik aletlerine bakıyor.">
    <div class="baslik">
      <img class="maskot" src="resimler/maskot.png" alt="Mavi fonda gülümseyen, sarı atkılı tilki maskotu.">
      <h1>Yaratıcılık Vadisi</h1>
      <a class="buton" href="#ilgiler">Kartları keşfet <span aria-hidden="true">↓</span></a>
    </div>
  </header>
  <main id="ilgiler">
    <h2>İlgi alanlarım</h2>
    <div class="kartlar">
      <figure><img src="resimler/bilgisayar.png" alt="Sarı kulaklıklı tilki, oyuncu koltuğunda bilgisayar kullanıyor."><figcaption>Bilgisayar</figcaption></figure>
      <figure><img src="resimler/futbol.png" alt="Sarı formalı tilki, kalenin önünde bir ayağını futbol topuna dayamış."><figcaption>Futbol</figcaption></figure>
      <figure><img src="resimler/muzik.png" alt="Lacivert takım elbiseli tilki, gözlerini kapatıp çello çalıyor."><figcaption>Klasik müzik</figcaption></figure>
    </div>
  </main>
  <footer><small>Bu sitedeki görseller yapay zekâ ile üretildi.</small></footer>
</body>
</html>
